name: Update MosDNS Rules

on:
  schedule:
    - cron: '33 2 * * 5'
  workflow_dispatch:

jobs:
  update-mosdns-rules:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check_changes.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        id: checkout
        with:
          fetch-depth: 1

      - name: Setup Timezone
        run: sudo timedatectl set-timezone "Asia/Shanghai"
        id: timezone

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
        id: python

      - name: Update MosDNS RuleSets
        id: check_changes
        run: python3 ${GITHUB_WORKSPACE}/Script/Workflow/mosdns_rules.py

      - name: Commit and Push Changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -- RuleSet/Extra/MosDNS/*.txt
          git commit -m "${COMMIT_MESSAGE}"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "推送被拒（第 ${attempt} 次），同步远端后重试"
            git fetch --depth=1 origin "${GITHUB_REF_NAME}"
            if ! git rebase --onto FETCH_HEAD HEAD~1; then
              git rebase --abort || true
              echo "::error::变基冲突：远端同路径已被修改"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "::error::推送重试耗尽"
          exit 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: "Update MosDNS rules: ${{ steps.check_changes.outputs.change_summary }}"

      - name: Delete old Workflows
        uses: ophub/delete-releases-workflows@main
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          delete_releases: true
          releases_keep_latest: 0
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 0
