name: Check Upstream Tasks

on:
  schedule:
    # 每天 UTC 0:00 执行 (北京时间 8:00)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: '首次建态或游标失效时回溯多少小时 (默认24小时)'
        required: false
        default: '24'
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: check-upstream-tasks
  cancel-in-progress: false

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Restore Upstream Task State
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/upstream-task-state
          key: upstream-task-state-${{ github.run_id }}
          restore-keys: |
            upstream-task-state-

      - name: Check Upstream Changes
        id: check_tasks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MONITOR_STATE_FILE: ${{ runner.temp }}/upstream-task-state/state.json
        run: >-
          python ${GITHUB_WORKSPACE}/Script/Workflow/upstream_monitor.py
          tasks --hours ${{ github.event.inputs.hours || '24' }}

      - name: Save Upstream Task State
        if: steps.check_tasks.outputs.cache_save == 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/upstream-task-state
          key: upstream-task-state-${{ steps.check_tasks.outputs.state_key }}-${{ github.run_id }}

      - name: Delete old Workflows
        uses: ophub/delete-releases-workflows@main
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          delete_releases: true
          releases_keep_latest: 0
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 0
